name: Update Resume PDF and Preview

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - ".github/workflows/update_readme_resume.yml"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Build PDF
      - name: Set up TeX Live
        uses: xu-cheng/latex-action@v3
        with:
          root_file: src/resume.tex
          work_in_root_file_dir: true
          args: "-pdf -interaction=nonstopmode -halt-on-error -jobname=Resume_GrantAchuzia -outdir=../build"

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Check PDF and generate preview
        run: |
          test "$(pdfinfo build/Resume_GrantAchuzia.pdf | awk '/^Pages:/ {print $2}')" = 1
          pdftotext build/Resume_GrantAchuzia.pdf - | grep -F 'grant.achuzia@gmail.com'
          mkdir -p images
          pdftoppm -png -singlefile -scale-to 1800 build/Resume_GrantAchuzia.pdf images/resume

      # Commit and push changes
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add build/Resume_GrantAchuzia.pdf images/resume.png
          git diff --staged --quiet || git commit -m "Update resume PDF and preview"
          git push
