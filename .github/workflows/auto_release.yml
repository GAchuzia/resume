name: Auto Release Resume

permissions:
  contents: write
  
on:
  push:
    # only on semantic-version tags vX.Y.Z
    tags:
      - 'v*.*.*'

jobs:
  autorelease-on-version-bump:
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout everything (including tags)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build PDF
      - name: Set up TeX Live
        uses: xu-cheng/latex-action@v3
        with:
          root_file: src/resume.tex
          work_in_root_file_dir: true
          args: "-pdf -interaction=nonstopmode -halt-on-error -jobname=Resume_GrantAchuzia -outdir=../build"

      - name: Create release with PDF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" build/Resume_GrantAchuzia.pdf \
            --title "Resume $TAG" --notes "Automated build of Resume $TAG"

# To trigger a release, create a tag with:
# git tag vX.Y.Z
# git push origin vX.Y.Z